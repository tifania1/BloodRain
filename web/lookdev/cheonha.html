<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* 천하 시안: 괴혼처럼 경지가 오를수록 시야와 걸음이 넓어지는 한 장짜리 강호. 선지·먹·주홍 한 가지 화풍이라 다크 테마를 따로 두지 않는다. */
:root {
  --paper: #EFE6D2; --paper-deep: #E2D6BC; --ink: #1A1A1A; --ink-soft: #4A4640; --wash: #8A8478;
  --gold: #C9A227; --crimson: #B3261E; --teal: #2F6F6A;
  --brush: "Nanum Brush Script", "Noto Serif KR", serif;
  --serif: "Noto Serif KR", "Apple SD Gothic Neo", "Malgun Gothic", serif;
  --num: ui-sans-serif, system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
html, body { height: 100%; overflow: hidden; }
body { background: var(--paper); color: var(--ink); font-family: var(--serif); overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
button { touch-action: manipulation; font: inherit; }
#game { position: fixed; inset: 0; overflow: hidden; background: var(--paper); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

#hud { position: absolute; inset: 0; pointer-events: none; }
#hud[hidden] { display: none; }
.hl { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(14px, env(safe-area-inset-left, 0px)); display: grid; gap: 5px; width: min(46vw, 260px); }
.realm { font: 400 34px/1 var(--brush); color: var(--crimson); text-shadow: 0 0 6px var(--paper); display: flex; gap: 8px; align-items: baseline; }
.realm small { font: 700 12px var(--num); color: var(--ink-soft); }
.bar { height: 8px; border: 1.5px solid var(--ink); background: rgba(239,230,210,.7); }
.bar i { display: block; height: 100%; width: 0; }
.bar.xp i { background: var(--gold); }
.bar.hp i { background: var(--teal); }
.bar.hp.low i { background: var(--crimson); }
.hr { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); text-align: right; font: 700 13px/1.6 var(--num); text-shadow: 0 1px 0 var(--paper); }
.hr b { font: 400 24px/1 var(--brush); display: block; }
.hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); font-size: 13px; color: var(--ink-soft); background: rgba(239,230,210,.82); padding: 6px 12px; border-radius: 3px; text-align: center; width: max-content; max-width: calc(100% - 140px); }
.dash { position: absolute; right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 74px; height: 74px; border-radius: 50%; border: 2px solid var(--ink); background: rgba(239,230,210,.88); font: 400 26px var(--brush); pointer-events: auto; display: grid; place-items: center; }
@media (hover: hover) and (pointer: fine) { .dash { display: none; } .hint { max-width: calc(100% - 32px); } }

.screen { position: absolute; inset: 0; display: flex; overflow-y: auto; padding: calc(20px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: rgba(239,230,210,.9); }
.panel { margin: auto; width: min(100%, 640px); display: grid; gap: 14px; justify-items: center; text-align: center; }
.big { font: 400 clamp(46px, 12vw, 76px)/1 var(--brush); }
.hanja { font: 400 clamp(54px, 14vw, 96px)/1 "Yuji Boku", var(--serif); letter-spacing: .04em; }
.lead { margin: 0; font-size: 14px; line-height: 1.8; max-width: 36em; color: var(--ink); }
.subtle { font-size: 13px; color: var(--ink-soft); }
.b { min-width: 140px; padding: 11px 18px; border: 2px solid var(--ink); border-radius: 3px; background: var(--paper); color: var(--ink); font: 700 15px/1.2 var(--serif); cursor: pointer; }
.b.main { background: var(--ink); color: var(--paper); }
.b:disabled { opacity: .4; cursor: default; }
.b small { display: block; font-weight: 400; font-size: 11px; margin-top: 3px; opacity: .85; }
.b:focus-visible, .card:focus-visible { outline: 3px solid var(--crimson); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; }
@media (max-width: 560px) { .cards { grid-template-columns: 1fr; } }
.card { display: grid; gap: 4px; justify-items: center; padding: 14px 10px; border: 2px solid var(--ink); border-radius: 3px; background: linear-gradient(var(--paper-deep), var(--paper) 40%); cursor: pointer; color: var(--ink); }
.card .seal { width: 56px; height: 56px; display: grid; place-items: center; background: var(--crimson); color: #F3EAD7; font: 400 24px/1 "Yuji Boku", var(--serif); border-radius: 6px; transform: rotate(-5deg); box-shadow: inset 0 0 0 3px var(--crimson), inset 0 0 0 5px #F3EAD7; }
.card h3 { margin: 4px 0 0; font-size: 17px; font-weight: 900; }
.card p { margin: 0; font-size: 12.5px; line-height: 1.5; color: var(--ink-soft); }
.card .bonus { color: #7A5A10; font-weight: 700; }
.meta { width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 420px) { .meta { grid-template-columns: 1fr; } }
.meta button { padding: 9px 6px; border: 1.5px solid var(--ink); border-radius: 3px; background: var(--paper); cursor: pointer; text-align: center; color: var(--ink); }
.meta button b { display: block; font-size: 14px; }
.meta button span { font-size: 11.5px; color: var(--ink-soft); }
.meta button:disabled { opacity: .45; cursor: default; }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 100%; }
@media (max-width: 420px) { .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.facts b { display: block; font: 700 19px var(--num); }
.facts span { font-size: 11.5px; color: var(--ink-soft); }
.keys { font-size: 12px; line-height: 1.8; color: var(--ink-soft); }
.keys kbd { font: 700 11px var(--num); border: 1px solid var(--ink-soft); border-radius: 3px; padding: 0 4px; background: var(--paper); }
</style>

<div id="game">
  <canvas id="cv"></canvas>
  <div id="hud" hidden>
    <div class="hl">
      <div class="realm"><span id="realm">삼류</span><small id="lvl">1단</small></div>
      <div class="bar xp"><i id="xp"></i></div>
      <div class="bar hp" id="hpbar"><i id="hp"></i></div>
    </div>
    <div class="hr"><b id="sect">소림</b><div id="kills">처치 0</div><div id="qi">윤회의 기 0</div></div>
    <div class="hint" id="hint"></div>
    <button class="dash" id="dash" type="button" aria-label="경공">輕功</button>

  <div class="screen" id="title">

      <div class="big">천하 시안</div>
      <p class="lead">한 번 죽으면 아무 문파의 제자로 다시 태어난다. 처음엔 문파 마당 몇 걸음만 보이지만, 경지가 오를수록 시야와 걸음이 넓어져 마을이 점이 되고 산맥이 발밑에 깔린다. 현경에 이르면 중원 전체가 한 화면이다. 괴혼식 시야 확장이 손맛이 있는지 보려는 놀이판이다.</p>
      <div class="row"><button class="b main" id="start" type="button">윤회 시작<small>다음 생을 고른다</small></button><button class="b" id="fast" type="button" aria-pressed="false">보통 속도<small>눌러서 기 3배(빨리 훑어보기)</small></button></div>
      <div class="keys">이동 <kbd>WASD</kbd>·<kbd>방향키</kbd> · 경공 <kbd>Space</kbd> · 정지 <kbd>Esc</kbd><br>휴대폰은 화면을 끌어서 이동, 오른쪽 아래 버튼으로 경공. 공격은 알아서 나간다</div>
      <div class="subtle" id="best"></div>
    </div>
  </div>

  <div class="screen" id="rebirth" hidden>
    <div class="panel">
      <div class="hanja">輪迴</div>
      <div class="subtle" id="rbsub">다음 생을 고르시오</div>
      <div class="cards" id="rbcards"></div>
      <div class="subtle" id="qileft">윤회의 기 0</div>
      <div class="meta" id="meta"></div>
    </div>
  </div>

  <div class="screen" id="dead" hidden>
    <div class="panel">
      <div class="big" id="dtitle">쓰러졌다</div>
      <p class="lead" id="dline"></p>
      <div class="facts" id="dfacts"></div>
      <div class="row"><button class="b main" id="again" type="button">윤회<small>기를 들고 다시 태어난다</small></button></div>
    </div>
  </div>
</div>

<script>
'use strict';
// ───────── 기본값 ─────────
// 지역 위치는 unity/BloodRain/Assets/Resources/Data/worldmap.json 의 pos 를 그대로 옮겼다(지도 위 비율).
const W = 4000, H = 2600;              // 강호 전체(세계 단위)
const S = 2.25;                        // 경지 한 단계마다 세상이 이만큼 작아진다
const VIEW0 = 36;                      // 삼류일 때 화면 대각선이 담는 세계 길이
const TIERS = [
  { name: '삼류', hanja: '三流', foe: '시강' }, { name: '이류', hanja: '二流', foe: '강시 패거리' },
  { name: '일류', hanja: '一流', foe: '강시 떼' }, { name: '절정', hanja: '絶頂', foe: '강시 군단' },
  { name: '초절정', hanja: '超絶頂', foe: '혈운 군세' }, { name: '화경', hanja: '化境', foe: '혈운 대군' },
  { name: '현경', hanja: '玄境', foe: '혈마' },
];
const MAXT = TIERS.length - 1;
const LV_PER_TIER = 8;
const REG = {
  cheongun: [0.66, 0.44, '靑雲鎭'], songshan: [0.60, 0.37, '嵩山'], danggata: [0.30, 0.56, '唐家坨'], janggang: [0.59, 0.62, '長江'],
  wudangsan: [0.47, 0.49, '武當山'], huashan: [0.45, 0.34, '華山'], kunlun: [0.12, 0.30, '崑崙'], sipmandaesan: [0.42, 0.86, '十萬大山'],
  bongmagok: [0.54, 0.45, '封魔谷'], namgung_manor: [0.76, 0.52, '南宮世家'], gaebang_hq: [0.55, 0.32, '丐幇總舵'],
};
// 환생할 수 있는 문파 9(기획서 20장 진전과 같은 9곳). 보너스는 이 시안에서만 쓰는 값.
const SECTS = [
  { id: 'shaolin', name: '소림', hanja: '少林', reg: 'songshan', robe: '#9A5B2E', bonus: '기혈 +30', mod: { hp: 30 } },
  { id: 'wudang', name: '무당', hanja: '武當', reg: 'wudangsan', robe: '#5E6E78', bonus: '초당 기혈 회복 +1', mod: { regen: 1 } },
  { id: 'huashan', name: '화산', hanja: '華山', reg: 'huashan', robe: '#A04A5A', bonus: '검기 빠르기 +25%', mod: { atk: 1.25 } },
  { id: 'gaebang', name: '개방', hanja: '丐幇', reg: 'gaebang_hq', robe: '#7A6A4A', bonus: '걸음 +15%', mod: { speed: 1.15 } },
  { id: 'tang', name: '당가', hanja: '唐門', reg: 'danggata', robe: '#3E5A3A', bonus: '검기 범위 +20%', mod: { area: 1.2 } },
  { id: 'namgung', name: '남궁', hanja: '南宮', reg: 'namgung_manor', robe: '#2F3F63', bonus: '피해 +20%', mod: { might: 1.2 } },
  { id: 'waterfort', name: '수로채', hanja: '水路', reg: 'janggang', robe: '#2F5A6A', bonus: '경공 충전 +1', mod: { dash: 1 } },
  { id: 'kunlun', name: '곤륜', hanja: '崑崙', reg: 'kunlun', robe: '#D9D6CC', bonus: '가까운 적이 10% 느려짐', mod: { chill: 0.9 } },
  { id: 'demonic', name: '마교', hanja: '魔敎', reg: 'sipmandaesan', robe: '#3A1E2A', bonus: '피해 +35%, 기혈 -25', mod: { might: 1.35, hp: -25 } },
];
const META = [
  { id: 'might', name: '공력', per: '피해 +8%', max: 10 },
  { id: 'hp', name: '기혈', per: '최대 기혈 +15', max: 10 },
  { id: 'speed', name: '신법', per: '걸음 +5%', max: 6 },
];
const INK = '#1A1A1A', PAPER = '#EFE6D2', GOLD = '#C9A227', CRIMSON = '#B3261E';

const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sc = t => Math.pow(S, t);
const easeInOut = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('cheonha_' + k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('cheonha_' + k, JSON.stringify(v)); } catch (e) { /* 저장이 막혀도 판은 돈다 */ } },
};
const meta = Object.assign({ qi: 0, might: 0, hp: 0, speed: 0, lives: 0, best: 0 }, store.get('meta') || {});
const saveMeta = () => store.set('meta', meta);

// 시드 있는 난수: 강호 지형은 매번 같아야 한다
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// ───────── 강호 지형 ─────────
const LAND = [[0.80,0.10],[0.88,0.16],[0.86,0.24],[0.80,0.26],[0.84,0.33],[0.80,0.40],[0.86,0.47],[0.88,0.56],[0.84,0.66],[0.80,0.74],[0.72,0.82],[0.62,0.88],[0.52,0.93],[0.44,0.96],[0.36,0.91],[0.30,0.85],[0.22,0.81],[0.12,0.75],[0.05,0.62],[0.03,0.48],[0.06,0.36],[0.04,0.24],[0.12,0.16],[0.24,0.12],[0.34,0.17],[0.44,0.13],[0.56,0.11],[0.66,0.06],[0.74,0.04]].map(([x, y]) => [x * W, y * H]);
const RIVERS = [
  [[0.16,0.30],[0.26,0.26],[0.35,0.22],[0.41,0.15],[0.47,0.19],[0.46,0.29],[0.52,0.33],[0.62,0.31],[0.72,0.29],[0.82,0.30]],
  [[0.12,0.52],[0.21,0.55],[0.30,0.58],[0.40,0.60],[0.48,0.63],[0.56,0.61],[0.62,0.63],[0.70,0.58],[0.78,0.57],[0.87,0.56]],
].map(r => r.map(([x, y]) => [x * W, y * H]));
function inLand(x, y) {
  let c = false;
  for (let i = 0, j = LAND.length - 1; i < LAND.length; j = i++) {
    const [xi, yi] = LAND[i], [xj, yj] = LAND[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}
// 소품: 나무 3~5, 집 7, 탑 22, 산 90~320. 크기가 세계 단위로 고정이라 시야가 넓어질수록 작아진다.
const props = [];
(function buildProps() {
  const r = rng(7);
  const add = (kind, x, y, s) => { if (inLand(x, y)) props.push({ kind, x, y, s, v: Math.floor(r() * 3) }); };
  for (const k in REG) {
    const [nx, ny] = REG[k], cx = nx * W, cy = ny * H;
    add('temple', cx, cy - 14, 22);
    for (let i = 0; i < 14; i++) { const a = r() * TAU, d = 16 + r() * 34; add('house', cx + Math.cos(a) * d, cy + Math.sin(a) * d, 6 + r() * 2); }
    for (let i = 0; i < 160; i++) { const a = r() * TAU, d = 8 + r() * 140; add('tree', cx + Math.cos(a) * d, cy + Math.sin(a) * d, 3 + r() * 2.5); }
  }
  for (let v = 0; v < 70; v++) {
    const cx = r() * W, cy = r() * H; if (!inLand(cx, cy)) continue;
    for (let i = 0; i < 6 + r() * 8; i++) { const a = r() * TAU, d = r() * 26; add('house', cx + Math.cos(a) * d, cy + Math.sin(a) * d, 6 + r() * 2); }
  }
  for (let i = 0; i < 6000; i++) add('tree', r() * W, r() * H, 3 + r() * 2.5);
  const ranges = [[0.03, 0.22, 0.18, 0.62, 70], [0.30, 0.50, 0.78, 0.94, 40], [0.40, 0.52, 0.28, 0.50, 28], [0.28, 0.60, 0.10, 0.17, 26], [0.20, 0.34, 0.40, 0.52, 18]];
  for (const [x0, x1, y0, y1, n] of ranges) for (let i = 0; i < n; i++) add('mount', lerp(x0, x1, r()) * W, lerp(y0, y1, r()) * H, 90 + r() * 230);
  props.sort((a, b) => a.y - b.y);
})();
const PCELL = 200, pgrid = new Map();
props.forEach((p, i) => { const k = Math.floor(p.x / PCELL) + ',' + Math.floor(p.y / PCELL); if (!pgrid.has(k)) pgrid.set(k, []); pgrid.get(k).push(i); });

// ───────── 그림 재료 ─────────
const cv = $('cv'), ctx = cv.getContext('2d');
let VW = 0, VH = 0, DPR = 1;
const off = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };
function figure(kind, px, robe) {
  // 자리 표시용 먹선 인물(삼재검법 시안과 같은 그림). 오른쪽을 보는 모습.
  const c = off(px, px), g = c.getContext('2d'), u = px / 100;
  g.lineJoin = 'round'; g.lineCap = 'round';
  const line = w => { g.lineWidth = w * u; g.strokeStyle = INK; g.stroke(); };
  const rect = (x, y, w, h, f, lw = 3) => { g.beginPath(); g.rect(x * u, y * u, w * u, h * u); g.fillStyle = f; g.fill(); if (lw) line(lw); };
  const ell = (x, y, rx, ry, f, lw = 3) => { g.beginPath(); g.ellipse(x * u, y * u, rx * u, ry * u, 0, 0, TAU); g.fillStyle = f; g.fill(); if (lw) line(lw); };
  const poly = (p, f, lw = 3) => { g.beginPath(); p.forEach((q, i) => i ? g.lineTo(q[0] * u, q[1] * u) : g.moveTo(q[0] * u, q[1] * u)); g.closePath(); g.fillStyle = f; g.fill(); if (lw) line(lw); };
  g.globalAlpha = 0.2; ell(50, 92, 24, 5.5, INK, 0); g.globalAlpha = 1;

  $('dline').textContent = won ? '중원이 한 화면에 들어왔다. 이번 생의 기는 다음 윤회로 넘어간다.' : `${G.sect.name}의 제자는 ${TIERS[G.tier].name}에서 쓰러졌다. 모은 기를 들고 다른 문파의 몸으로 다시 태어난다.`;
  $('dfacts').innerHTML = [[TIERS[G.tier].name, '오른 경지'], [G.kills.toLocaleString(), '처치'], [`+${gain}`, '윤회의 기'], [Math.floor(G.t / 60) + ':' + String(Math.floor(G.t % 60)).padStart(2, '0'), '버틴 시간']].map(f => `<div><b>${f[0]}</b><span>${f[1]}</span></div>`).join('');
  show('dead');
}
function updateHud() {
  const p = G.p;
  $('realm').textContent = TIERS[G.tier].name; $('lvl').textContent = G.tier >= MAXT ? '' : `${G.lv + 1}단 / ${LV_PER_TIER}`;
  $('xp').style.width = (G.tier >= MAXT ? 100 : clamp(G.xp / xpReq(G.lv), 0, 1) * 100).toFixed(1) + '%';
  $('hp').style.width = (p.hp / p.maxHp * 100).toFixed(1) + '%'; $('hpbar').classList.toggle('low', p.hp / p.maxHp < 0.3);
  $('kills').textContent = `처치 ${G.kills.toLocaleString()}`; $('qi').textContent = `윤회의 기 +${Math.floor(G.qiGain)}`;
}
let last = 0, hudAcc = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (ts - last) / 1000); last = ts;
  if (running && !paused) { update(dt); hudAcc += dt; if (hudAcc > 0.1) { hudAcc = 0; updateHud(); } }
  render();
}

// ───────── 입력 ─────────
window.addEventListener('keydown', e => {
  input.keys.add(e.code);
  if (overlay === 'title' && e.code === 'Enter') { openRebirth(); return; }
  if (overlay === 'rebirth') { const n = parseInt(e.key, 10); if (n >= 1 && n <= 3) beginLife(n - 1); return; }
  if (overlay === 'dead' && e.code === 'Enter') { openRebirth(); return; }
  if (!running) return;
  if (e.code === 'Space' || e.code.startsWith('Shift')) { e.preventDefault(); doDash(); }
  if (e.code === 'Escape') paused = !paused;
});
window.addEventListener('keyup', e => input.keys.delete(e.code));
window.addEventListener('blur', () => { input.keys.clear(); input.joy = null; });
let joyId = null, ox = 0, oy = 0;
cv.addEventListener('pointerdown', e => { if (!running) return; joyId = e.pointerId; ox = e.clientX; oy = e.clientY; input.joy = { dx: 0, dy: 0 }; try { cv.setPointerCapture(e.pointerId); } catch (err) { /* 캡처가 안 돼도 움직인다 */ } });
cv.addEventListener('pointermove', e => {
  if (e.pointerId !== joyId || !input.joy) return;
  const dx = e.clientX - ox, dy = e.clientY - oy, m = Math.hypot(dx, dy), R = 56;
  if (m < 6) { input.joy.dx = 0; input.joy.dy = 0; return; }
  const s = Math.min(1, m / R); input.joy.dx = dx / m * s; input.joy.dy = dy / m * s;
  if (m > R * 1.6) { ox = e.clientX - dx / m * R * 1.6; oy = e.clientY - dy / m * R * 1.6; }
});
const endJoy = e => { if (e.pointerId === joyId) { joyId = null; input.joy = null; } };
cv.addEventListener('pointerup', endJoy); cv.addEventListener('pointercancel', endJoy);
$('dash').addEventListener('pointerdown', e => { e.preventDefault(); doDash(); });
$('start').addEventListener('click', openRebirth);
let fast = store.get('fast') === true;
const syncFast = () => { $('fast').innerHTML = fast ? '빨리 훑어보기<small>기 3배 · 눌러서 보통으로</small>' : '보통 속도<small>눌러서 기 3배(빨리 훑어보기)</small>'; $('fast').setAttribute('aria-pressed', String(fast)); };
$('fast').addEventListener('click', () => { fast = !fast; store.set('fast', fast); syncFast(); }); syncFast();
$('again').addEventListener('click', openRebirth);
document.addEventListener('visibilitychange', () => { if (document.hidden) paused = true; });
cv.addEventListener('click', () => { if (paused) paused = false; });

// 시험용: 자동 판, 경지 바로 올리기
window.__ch = {
  state: () => G,
  start(i) { candidates = [SECTS[i || 0]]; beginLife(0); },
  setTier(t) { while (G.tier < t) { G.lv = LV_PER_TIER - 1; G.xp = 0; gainXp(xpReq(G.lv)); while (G.brk) update(1 / 30); } },
  step: (dt) => update(dt), render,
  sim(seconds, auto) {
    running = false; G.auto = auto !== false; const out = [];
    for (let t = 0, next = 30; t < seconds && overlay !== 'dead' && !G.won; t += 1 / 30) { update(1 / 30); if (t >= next) { next += 30; out.push(`${Math.round(t)}초 ${TIERS[G.tier].name} ${G.lv}단 적${G.foes.length} 기혈${Math.round(G.p.hp)} 처치${G.kills}`); } }
    return { out, tier: G.tier, t: G.t, dead: overlay === 'dead', won: G.won };
  },
};

window.addEventListener('resize', resize);
resize(); buildArt();
$('best').textContent = meta.lives ? `윤회 ${meta.lives}번 · 가장 높이 오른 경지 ${TIERS[meta.best].name} · 남은 기 ${Math.floor(meta.qi)}` : '';
requestAnimationFrame(t => { last = t; frame(t); });
</script>
