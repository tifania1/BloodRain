<title>문파 이펙트 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
:root{--bg:#efe6d0;--fg:#1c1a17;--mut:#6b6457;--line:#cbbf9f;--btn:#e4d9bb;--on:#1c1a17;--onfg:#f3ead4;--gold:#8a6c0c;--stage:#0e0d0b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#16140f;--fg:#ece3cc;--mut:#a2977f;--line:#3b3628;--btn:#27231a;--on:#e9dfc4;--onfg:#17150f;--gold:#d7b545;--stage:#000;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16140f;--fg:#ece3cc;--mut:#a2977f;--line:#3b3628;--btn:#27231a;--on:#e9dfc4;--onfg:#17150f;--gold:#d7b545;--stage:#000;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:"Noto Serif KR","Apple SD Gothic Neo","Malgun Gothic",serif;font-size:15px;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1{font-size:26px;font-weight:900;margin:0;letter-spacing:.02em;text-wrap:balance}
h1 small{font-size:14px;font-weight:400;color:var(--mut);margin-left:.6em;letter-spacing:0}
.lead{margin:0;color:var(--mut);max-width:65ch}
.bar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grp>span{font-size:12px;color:var(--mut);letter-spacing:.12em;margin-right:2px}
button{font:inherit;font-size:14px;padding:7px 13px;border:1px solid var(--line);background:var(--btn);color:var(--fg);border-radius:3px;cursor:pointer;min-height:36px}
button[aria-pressed="true"]{background:var(--on);color:var(--onfg);border-color:var(--on);font-weight:600}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.stage{position:relative;width:100%;aspect-ratio:16/9;background:var(--stage);border:1px solid var(--line);overflow:hidden;max-width:100%}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.note{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 22px;margin:0;padding:0;list-style:none}
.note li{border-top:1px solid var(--line);padding-top:8px;min-width:0}
.note b{display:block;font-size:12px;letter-spacing:.14em;color:var(--gold);font-weight:600}
.err{padding:14px;border:1px solid var(--line)}
</style>
<div class="wrap">
  <h1>문파 이펙트 시안 <small>혈우강호 · 2026-11-13</small></h1>

  </div>

</div>

 addFx(.44,(f,k)=>{const t=f.t,pg=Math.min(1,t/.11),ds=Math.max(0,(t-.17)/.27);
  if(wash)fx(0,Pl.x,Pl.y+.6,S*1.12*(1+.1*k),S*1.12*(1+.1*k)*dir,ang,{p:[span,.6,1,.25],c:wash,alpha:.55*(1-k),prog:pg,diss:ds*.5,seed:f.seed});
  fx(0,Pl.x,Pl.y+.6,S,S*dir,ang,{p:[span,.46,1,rough],c:ink,prog:pg,diss:ds,seed:f.seed});
  if(gold)glow(0,Pl.x,Pl.y+.6,S*1.03,S*1.03*dir,ang,{p:[span,.11,1,.3],c:gold,prog:pg,diss:ds*1.2,seed:f.seed+2});
 },[{t:.07,f:()=>{let n=0;for(const e of E)if(inArc(e,ang,span,R)){hit(e,dmg+tier*3,Math.atan2(e.y,e.x),kb,kind,gold&&n===0);n++;}}}]);}
function punch(ang,last){
 Pl.lunge=last?.5:.3;Pl.la=ang;const reach=last?2.7:2.2,sz=last?4.0:2.9;const tx=Math.cos(ang)*reach,ty=Math.sin(ang)*reach+.6;
 if(old){addFx(.12,()=>fx(5,Pl.x,Pl.y+.6,2.2,2.2,0,{p:[.95],c:[[.85,.55,.25],[.85,.55,.25],[.85,.55,.25]],alpha:.6}),[{t:.02,f:()=>{for(const e of E)if(Math.hypot(e.x,e.y)<1.5)hit(e,9,ang,3,'gold');}}]);return;}
 addFx(.38,(f,k)=>{const t=f.t,go=Math.min(1,t/.08),ez=1-(1-go)*(1-go),ds=Math.max(0,(t-.2)/.18);
  const d=.4+(reach-.75)*ez,x=Math.cos(ang)*d,y=Math.sin(ang)*d+.6;
  fx(7,x-Math.cos(ang)*.1,y-Math.sin(ang)*.1-.06,sz*1.12,sz*.86,ang,{c:INK,alpha:.62,diss:ds,seed:f.seed});
  glow(7,x,y,sz,sz*.74,ang,{c:GOLD,diss:ds,seed:f.seed});
 },[{t:.08,f:()=>{const rr=last?1.6:1.1;for(const e of E)if(Math.hypot(e.x-tx,e.y+.6-ty)<rr+e.r)hit(e,last?18:9,ang,last?12:6,'gold',last);
   ring(tx,ty,last?5:3.2,INK,false,.26,.55);ring(tx,ty,last?4.8:3,GOLD,false,.26,1,true);
   addFx(.11,(g,k)=>glow(3,tx,ty,(last?3.4:2.2)*(1+k*.5),(last?3.4:2.2)*(1+k*.5),g.seed,{p:[5,.28,.8],c:GOLD,alpha:1-k,seed:g.seed}));
   if(last){later(.1,()=>{ring(tx,ty,7.4,INK,false,.36,.35);ring(tx,ty,7.2,GOLD,false,.36,.8,true);});shake(.25,ang);}}}]);}
function ring(x,y,size,c,add,life,al,gl2){addFx(life,(f,k)=>(gl2?glow:fx)(2,x,y,size,size,0,{p:[.15+.75*(1-(1-k)*(1-k)),.11*(1-k*.6)+.025,.45],c,add,alpha:(al||1)*(1-k*k),seed:f.seed}));}
function thump(x,y){if(old)return;ring(x,y+.6,3.6,DUST,false,.32,.9);ring(x,y+.6,3.4,BROWN,false,.3,.4);drops(x,y+.6,0,9,6,AMBER,true,.13,3.14);shake(.12);
 for(const e of E)if(Math.hypot(e.x-x,e.y-y)<1.1)hit(e,6,Math.atan2(e.y-y,e.x-x),6,'amber');}
function orbit(a0,dirn){const R=1.9*TS[tier-1],S=2*R/.78,dur=.5,seen=new Set();
 if(old){addFx(dur,(f,k)=>{const ha=a0+6.283*k;fx(0,Pl.x,Pl.y+.6,S,S,ha-.6,{p:[1.2,.22,1,0],c:[[.95,.93,.85],[.95,.93,.85],[.95,.93,.85]],alpha:.75});
   for(const e of E){if(seen.has(e))continue;if(inArc(e,ha,.7,R)){seen.add(e);hit(e,10,Math.atan2(e.y,e.x),3,'blue');}}});return;}
 addFx(dur+.3,(f,k)=>{const t=f.t,pg=Math.min(1,t/dur),ds=Math.max(0,(t-dur)/.3),rot=a0+Math.PI;
  fx(0,Pl.x,Pl.y+.6,S*1.04,S*1.04,rot,{p:[6.283,.3,.1,.5],c:BLUEINK,alpha:.6,prog:pg/1.12,diss:ds,seed:f.seed});
  fx(0,Pl.x,Pl.y+.6,S*1.08,S*1.08,rot,{p:[6.283,.5,.08,.3],c:[BLUE[1],BLUE[1],BLUE[1]],alpha:.25,prog:pg/1.12,diss:ds,seed:f.seed+1});
  glow(0,Pl.x,Pl.y+.6,S,S,rot,{p:[6.283,.24,.14,.45],c:BLUE,prog:pg/1.12,diss:ds,seed:f.seed+3});
  if(t<dur){const ha=a0+6.283*pg;for(const e of E){if(e.dead>=0||seen.has(e))continue;if(inArc(e,ha-.25,.9,R)){seen.add(e);hit(e,11+tier*2,Math.atan2(e.y,e.x),4,'blue');
    let o=null,od=9;for(const q of E){if(q===e||q.dead>=0)continue;const d=(q.x-e.x)**2+(q.y-e.y)**2;if(d<od){od=d;o=q;}}if(o)bolt(e.x,e.y+.7,o.x,o.y+.7,()=>hit(o,5,Math.atan2(o.y-e.y,o.x-e.x),1,'blue'));}}}
 });}
function bolt(x0,y0,x1,y1,f){const dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy),a=Math.atan2(dy,dx);
 addFx(.16,(e,k)=>{fx(4,(x0+x1)/2,(y0+y1)/2,L,1.6,a,{p:[.35,.06,.5],c:BLUEINK,alpha:.5*(1-k*k),seed:e.seed});glow(4,(x0+x1)/2,(y0+y1)/2,L,1.6,a,{p:[.35,.035,.5],c:BLUE,alpha:1-k*k,seed:e.seed});},f?[{t:.03,f}]:[]);}
function skySword(){const live=E.filter(e=>e.dead<0&&Math.hypot(e.x,e.y)<7);if(!live.length)return;const e=live[(Math.random()*live.length)|0];const x=e.x,y=e.y;
 if(old){addFx(.25,(f,k)=>fx(5,x,y+.3,2.4,2.4,0,{p:[.95],c:[[.8,.9,1],[.8,.9,1],[.8,.9,1]],alpha:.7*(1-k)}),[{t:.02,f:()=>{for(const q of E)if(Math.hypot(q.x-x,q.y-y)<1.3)hit(q,14,0,2,'blue');}}]);return;}
 addFx(.3,(f,k)=>fx(2,x,y+.2,3,1.8,0,{p:[.7-.3*k,.05,.3],c:BLUE,alpha:.7*k}),null,true);
 later(.3,()=>{addFx(.34,(f,k)=>{const t=f.t,pg=Math.min(1,t/.07),ds=Math.max(0,(t-.12)/.22);
   fx(1,x,y+5.2,10,1.7,-Math.PI/2,{p:[.42,.3,2,1],c:BLUEINK,alpha:.55,prog:pg,diss:ds,seed:f.seed});
   glow(1,x,y+5.2,10,1.3,-Math.PI/2,{p:[.42,.4,3,1],c:BLUE,prog:pg,diss:ds,seed:f.seed+1});
  },[{t:.07,f:()=>{for(const q of E)if(Math.hypot(q.x-x,q.y-y)<1.4+q.r)hit(q,22,Math.atan2(q.y-y,q.x-x)||0,8,'blue',true);
    ring(x,y+.3,4.6,BLUEINK,false,.28,.5);ring(x,y+.3,4.4,BLUE,false,.28,1,true);
    addFx(.14,(g,k)=>glow(3,x,y+.4,3.4,3.4,g.seed,{p:[11,.9,.8],c:BLUE,alpha:1-k,seed:g.seed}));shake(.4,-Math.PI/2);stop(.05);}}]);});}

// ── 한 프레임 ──────────────────────────────────────────
function step(dt){
 for(let i=LATER.length-1;i>=0;i--){const l=LATER[i];l.t-=dt;if(l.t<=0){LATER.splice(i,1);l.f();}}
 cool-=dt;if(cool<=0){const tg=nearest(4.2);if(tg){Pl.face=Math.atan2(tg.y,tg.x);STY[style].fire(Pl.face);fired++;cool=STY[style].cd;}else cool=.1;}
 Pl.lunge*=Math.pow(.0005,dt);Pl.sway*=Math.pow(.02,dt);
 let alive=0;for(let i=E.length-1;i>=0;i--){const e=E[i];
  if(e.dead>=0){e.dead+=dt;e.x+=e.kx*dt;e.y+=e.ky*dt;e.kx*=Math.pow(.01,dt);e.ky*=Math.pow(.01,dt);if(e.dead>(old?.12:e.split?.6:.4))E.splice(i,1);continue;}
  alive++;const d=Math.hypot(e.x,e.y)||1;if(d>1.0){e.x-=e.x/d*1.25*dt;e.y-=e.y/d*1.25*dt;}
  e.x+=e.kx*dt;e.y+=e.ky*dt;const dk=Math.pow(.004,dt);e.kx*=dk;e.ky*=dk;e.fl=Math.max(0,e.fl-dt/.055);e.sq=Math.max(0,e.sq-dt/.16);}
 if(alive<26)spawn(26-alive);
 for(let i=FX.length-1;i>=0;i--){const f=FX[i];const t0=f.t;f.t+=dt;for(const h of f.hooks)if(t0<h.t&&f.t>=h.t)h.f();if(f.t>=f.life)FX.splice(i,1);}
 for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;const dr=Math.pow(.02,dt);p.vx*=dr;p.vy*=dr;if(p.t>=p.life)PT.splice(i,1);}
 for(let i=ST.length-1;i>=0;i--){ST[i].t+=dt;if(ST[i].t>8)ST.splice(i,1);}   // 바닥 먹 자국 8초에 마름(review 6절 잔흔)
 for(let i=NUM.length-1;i>=0;i--){NUM[i].t+=dt;if(NUM[i].t>.7)NUM.splice(i,1);}
}
function draw(){
 gl.disable(gl.BLEND);fx(9,cam[0],cam[1],VW*2,VH*2,0,{});
 gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
 for(const s of ST){const k=s.t/8;fx(3,s.x,s.y,s.s*2,s.s*1.4,s.rot,{p:[3,.35,.8],c:INK,alpha:.26*(1-k)*(1-k),diss:.12+k*.5,seed:s.seed});}
 for(const f of FX)if(f.under)f.draw(f,f.t/f.life);
 const list=E.slice().sort((a,b)=>b.y-a.y);let pd=false;
 const drawP=()=>{const lx=Math.cos(Pl.la)*Pl.lunge,ly=Math.sin(Pl.la)*Pl.lunge;fx(5,Pl.x+lx,Pl.y+ly-.02,1.5,.55,0,{p:[.2],c:INK,alpha:.22});
  sprite(TPLY,Pl.x+lx,Pl.y+ly+.95,(Math.cos(Pl.face)<0?-1:1)*2.5,2.5,Pl.sway+Math.cos(Pl.la)*Pl.lunge*-.25,{});};
 for(const e of list){if(!pd&&e.y<Pl.y){drawP();pd=true;}
  const hop=Math.abs(Math.sin(time*5+e.seed))*.13,sq=old?0:e.sq;
  if(e.dead<0)fx(5,e.x,e.y-.02,1.2,.45,0,{p:[.2],c:INK,alpha:.2});
  if(e.split&&e.dead>=0&&!old){const fl=e.x>Pl.x?-1:1,nx=Math.cos(e.ca),ny=Math.sin(e.ca),sl=Math.min(1,e.dead/.25),gap=(1-(1-sl)*(1-sl))*.55,dz=Math.max(0,Math.min(.99,(e.dead-.18)/.42));
   for(const sd of[1,-1])sprite(TSIG,e.x+nx*gap*sd,e.y+.85+ny*gap*sd-e.dead*.4*(sd<0?1:.4),fl*1.9,1.9,sd*e.dead*.5,{flash:Math.max(0,1-e.dead/.06),diss:dz,cut:[nx*fl,ny,sd]});}
  else sprite(TSIG,e.x,e.y+.85+hop,(e.x>Pl.x?-1:1)*1.9*(1+.28*sq),1.9*(1-.22*sq),Math.cos(e.sa)*sq*.35,{flash:old?0:e.fl,sil:old?1:0,diss:e.dead>=0?(old?.01:Math.min(.99,e.dead/.4)):0,alpha:e.dead>=0&&old?1-e.dead/.12:1});}
 if(!pd)drawP();
 for(const f of FX)if(!f.under)f.draw(f,f.t/f.life);
 for(const p of PT){const k=p.t/p.life,sp=Math.hypot(p.vx,p.vy);(p.add?glow:fx)(5,p.x,p.y,p.size*(1+sp*.09),p.size*(1-k*.5),Math.atan2(p.vy,p.vx),{p:[p.add?.3:.55],c:p.col,alpha:.92*(1-k*k)});}
 // 숫자와 이름표
 c2.setTransform(1,0,0,1,0,0);c2.clearRect(0,0,W,H);const sc=H/(VH*2);c2.textAlign='center';
 for(const n of NUM){const k=n.t/.7,x=(n.x-cam[0]+VW)*sc,y=H-(n.y-cam[1]+VH+k*1.1)*sc,pop=old?1:1+.6*Math.max(0,1-n.t/.1);
  c2.font=`${n.big&&!old?900:600} ${Math.round((n.big&&!old?20:13)*DPR*pop*(W/DPR/1000+.35))}px "Noto Serif KR",serif`;c2.globalAlpha=1-k*k;
  c2.lineWidth=3*DPR;c2.strokeStyle='rgba(240,232,210,.9)';c2.strokeText(n.v,x,y);c2.fillStyle=n.big&&!old?'#8a5a00':'#1c1a17';c2.fillText(n.v,x,y);}
 c2.globalAlpha=1;c2.textAlign='left';c2.fillStyle='rgba(28,26,23,.82)';const fs=Math.max(12,Math.round(W/62));
 c2.font=`900 ${fs*1.25}px "Noto Serif KR",serif`;c2.fillText(STY[style].label+(old?'':'  '+tier+'단'),fs,fs*1.9);
 c2.font=`400 ${fs*.85}px "Noto Serif KR",serif`;c2.fillStyle='rgba(28,26,23,.6)';c2.fillText(old?'지금 빌드 방식: 도형 한 장, 반응 없음':STY[style].who,fs,fs*3.2);
}
let last=performance.now(),paused=false;
function frame(now){const real=Math.min(.05,(now-last)/1000);last=now;
 if(paused){draw();requestAnimationFrame(frame);return;}hsLock=Math.max(0,hsLock-real);let dt=real;if(hs>0){hs-=real;dt=0;}
 trauma=Math.max(0,trauma-real*2.2);kick[0]*=Math.pow(.0001,real);kick[1]*=Math.pow(.0001,real);
 time+=dt;if(dt>0)step(dt);
 const t2=trauma*trauma;cam=[kick[0]+(Math.sin(now*.071)+Math.sin(now*.113))*.14*t2,kick[1]+(Math.cos(now*.083)+Math.sin(now*.127))*.14*t2];
 draw();requestAnimationFrame(frame);}
// ── 단추 ──────────────────────────────────────────
function group(id,items,get,set){const g=document.getElementById(id);for(const[val,label]of items){const b=document.createElement('button');b.type='button';b.textContent=label;b.dataset.v=val;b.onclick=()=>{set(val);sync();};g.appendChild(b);}
 g._sync=()=>{for(const b of g.querySelectorAll('button'))b.setAttribute('aria-pressed',String(String(get())===b.dataset.v));};}
function sync(){for(const id of['gStyle','gTier','gMode'])document.getElementById(id)._sync();
 document.getElementById('note').innerHTML=STY[style].notes.map(([h,t])=>`<li><b>${h}</b>${t}</li>`).join('');}
function reset(){FX.length=PT.length=LATER.length=0;cool=.3;}
group('gStyle',Object.keys(STY).map(k=>[k,STY[k].label]),()=>style,v=>{style=v;reset();});
group('gTier',[[1,'1단'],[2,'2단'],[3,'3단']],()=>tier,v=>{tier=+v;reset();});
group('gMode',[['new','개편안'],['old','지금 방식']],()=>old?'old':'new',v=>{old=v==='old';reset();});
const h=(location.hash||'').slice(1).split('-');if(STY[h[0]])style=h[0];if(+h[1]>=1&&+h[1]<=3)tier=+h[1];if(h[2]==='old')old=true;
sync();spawn(26);for(const e of E){const k=rnd(.25,1);e.x*=k;e.y*=k;}
window.__sects={get n(){return E.length},get fx(){return FX.length},pause(v){paused=v;},adv(dt){time+=dt;hsLock=0;hs=0;step(dt);}};
requestAnimationFrame(frame);
})();
