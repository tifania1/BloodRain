# 코어 규칙과 데이터 테스트. 푸시마다 돈다. 예약 세션이 main 승격을 판단할 때 이 결과를 본다.
name: 코어 테스트

on:
  push:
    branches: [main, claude/dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 데이터 JSON 문법 확인
        run: |
          for f in unity/BloodRain/Assets/Resources/Data/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$f" || { echo "::error file=$f::JSON 문법 오류"; exit 1; }
          done
          python3 -c "import json; [json.loads(l) for l in open('art_queue/queue.jsonl', encoding='utf-8') if l.strip()]" || { echo "::error file=art_queue/queue.jsonl::대기열 문법 오류"; exit 1; }
          python3 -c "import json; [json.loads(l) for l in open('audio_queue/queue.jsonl', encoding='utf-8') if l.strip()]" || { echo "::error file=audio_queue/queue.jsonl::대기열 문법 오류"; exit 1; }
          python3 -c "import json; [json.loads(l) for l in open('sfx_queue/queue.jsonl', encoding='utf-8') if l.strip()]" || { echo "::error file=sfx_queue/queue.jsonl::대기열 문법 오류"; exit 1; }
      - name: 도구 테스트(파이썬)
        # ffmpeg 가 없으면 MP3 → ogg 한 바퀴 테스트는 건너뛰고 계산 테스트만 돈다
        # test_postprocess_art(PR-02)가 PIL 을 쓴다. 러너 기본 파이썬엔 없어서 깐다(11-08 하루 내내 이걸로 실패)
        run: |
          python3 -m pip install --quiet pillow
          python3 -m unittest discover -s tools/tests
      - name: 테스트
        run: dotnet test core/BloodRain.sln --nologo
      - name: Unity 조건 빌드(nullable 꺼짐)
        # Unity 는 프로젝트 단위 nullable 을 켜지 않는다. ? 를 쓰는 파일은 맨 위에 #nullable enable 이 있어야 CS8632 경고가 안 난다.
        run: dotnet build core/BloodRain.Core/BloodRain.Core.csproj --nologo -p:Nullable=disable -p:TreatWarningsAsErrors=false -warnaserror:CS8632 -o /tmp/unity-like
