# 웹 프로토타입(web/prototype)을 묶어서 Cloudflare Pages(bloodrain-proto)에 올린다.
#   main       → 정식 주소 https://bloodrain-proto.pages.dev
#   claude/dev → 미리보기 주소 https://claude-dev.bloodrain-proto.pages.dev (밤사이 바뀐 것)
#
# 묶기는 비밀값 없이도 늘 돈다(빌드가 깨졌는지 확인용).
# 올리기는 CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID 비밀값이 있어야 한다. WebGL 배포와 같은 값이다.
# 비밀값이 없으면 PC에서 python tools/deploy_web_prototype.py 로 올린다(wrangler 로그인 필요).
#
# 자동 점검(WP-04): 묶은 뒤 tools/web_autocheck.js 를 2판씩 돌린다(크로미움 설치 1분 남짓 + 점검 2분).
# 점검에서 문제가 나오면 올리기를 막는다(WP-05, 2026-11-12: 11-04~11-11 실행 141번 모두 '문제 0'이라 continue-on-error 를 지움).
# 준비(크로미움 깔기)가 실패하면 점검을 못 돌리니 막지 않고 노란 경고만 남긴다(게임 문제가 아니라 러너 문제라서).
# 판 끝 화면은 'web-autocheck' 아티팩트(14일)에 남는다. 준비나 점검이 실패하면 노란 경고(warning)가 붙는다.

name: 웹 프로토타입 배포

on:
  push:
    branches: [main, claude/dev]
    paths:
      - web/prototype/**
      - web/lookdev/**
      - unity/BloodRain/Assets/Resources/Data/**
      - unity/BloodRain/Assets/Art/Cutscenes/**
      - tools/build_web_prototype.py
      - tools/web_autocheck.js
      - .github/workflows/web-prototype.yml
  workflow_dispatch:

concurrency:
  group: web-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # ubuntu-latest(26.04)는 Playwright 가 크로미움 의존성을 못 깐다(11-04 실행 150). 24.04 로 고정
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: 묶기
        run: python tools/build_web_prototype.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 점검 준비(Playwright 크로미움)
        id: pw
        continue-on-error: true
        # 저장소에 package.json 이 없어 여기서만 깐다. 판은 고정(이 판으로 클라우드 컨테이너 ubuntu 24.04 에서 확인).
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: 자동 점검
        id: autocheck
        if: steps.pw.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          node tools/web_autocheck.js --runs 2 --shots /tmp/autocheck-shots | tee /tmp/autocheck.txt
      - name: 점검 결과 남기기
        if: always()
        shell: bash
        run: |
          {
            echo "### 웹 자동 점검 (준비 ${{ steps.pw.outcome }}, 점검 ${{ steps.autocheck.outcome }})"
            echo '```'
            if [ -f /tmp/autocheck.txt ]; then tail -n 40 /tmp/autocheck.txt; else echo "점검이 돌지 않았다(준비 단계 로그를 본다)"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.autocheck.outcome }}" != "success" ]; then
            # 점검 실패면 이 뒤 올리기는 돌지 않는다. 준비 실패(점검 skipped)면 올리기는 그대로 한다
            echo "::warning::웹 자동 점검이 통과하지 못했다(준비 ${{ steps.pw.outcome }}, 점검 ${{ steps.autocheck.outcome }}). $(tail -n 1 /tmp/autocheck.txt 2>/dev/null)"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-autocheck
          path: |
            /tmp/autocheck.txt
            /tmp/autocheck-shots/
          if-no-files-found: ignore
          retention-days: 14
      - name: 올리기
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::비밀값이 없어 올리기는 건너뜀 — 묶기는 통과"
            exit 0
          fi
          npx --yes wrangler@3 pages project create bloodrain-proto --production-branch main 2>/dev/null || true
          npx --yes wrangler@3 pages deploy web/prototype/site --project-name bloodrain-proto --branch "${GITHUB_REF_NAME}" --commit-dirty=true
